<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LinkedIn Games — Leaderboard</title>
<style>
  :root {
    --bg: #f3f2ef; --card: #ffffff; --ink: #1d2226; --muted: #56687a;
    --line: #e6e3df; --accent: #0a66c2; --gold: #fff8e1; --alt: #fafaf8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1f23; --card: #26292d; --ink: #e9e5df; --muted: #a3adba;
      --line: #3a3f45; --accent: #70b5f9; --gold: #3a3320; --alt: #2b2f34;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.4; padding: 24px 16px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  header h1 { font-size: 22px; margin: 0; }
  .in { color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; position: relative; }
  button {
    font-size: 18px; width: 42px; height: 42px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .daybtn {
    flex: 1; min-width: 200px; width: auto; height: 42px; font-size: 16px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
  }
  /* Calendar popover */
  .calpop {
    position: absolute; top: 50px; left: 52px; z-index: 20; width: 300px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; box-shadow: 0 12px 32px rgba(0,0,0,.18);
  }
  .calpop[hidden] { display: none; }
  .calhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .calhead #calTitle { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
  .calhead button { width: 34px; height: 34px; font-size: 16px; }
  .calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .caldow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding-bottom: 4px; }
  .calday {
    height: 34px; border-radius: 8px; border: none; background: transparent; color: var(--ink);
    font-size: 14px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center;
  }
  .calday.empty { visibility: hidden; }
  .calday.disabled { color: var(--muted); opacity: .35; cursor: default; }
  .calday.has { background: var(--alt); font-weight: 600; }
  .calday.has:hover { border: 1px solid var(--accent); color: var(--accent); }
  .calday.sel { background: var(--accent); color: #fff; }
  .badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 18px;
  }
  .card h2 { margin: 0 0 12px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--alt); }
  th { color: var(--muted); font-size: 13px; font-weight: 600; }
  th.game, td.game { text-align: left; white-space: nowrap; }
  td.game .gname { color: var(--muted); font-size: 13px; margin-left: 6px; }
  td.time { font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  td.miss { color: var(--muted); }
  td.medal { font-size: 18px; }
  .best { background: var(--gold); }
  .legend { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .legend b { color: var(--ink); }
  nav { display: flex; gap: 8px; margin: 14px 0 20px; }
  nav a {
    text-decoration: none; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); background: var(--card);
  }
  nav a.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="in">in</span><h1>LinkedIn Games</h1>
  </header>
  <p class="sub">Daily leaderboard — pick a day to see the tables.</p>

  <nav>
    <a href="leaderboard.html" class="active">Daily</a>
    <a href="stats.html">Cumulative ranking</a>
  </nav>

  <div class="controls">
    <button id="prev" title="Previous day">‹</button>
    <button id="dayBtn" class="daybtn" title="Pick a date">📅 <span id="dayLabel"></span></button>
    <button id="next" title="Next day">›</button>
    <span class="badge" id="src"></span>

    <div class="calpop" id="calpop" hidden>
      <div class="calhead">
        <button id="calPrev" title="Previous month">‹</button>
        <div id="calTitle"></div>
        <button id="calNext" title="Next month">›</button>
      </div>
      <div class="calgrid" id="calDow"></div>
      <div class="calgrid" id="calDays"></div>
    </div>
  </div>

  <div class="card">
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <h2>⏱ Times</h2>
    <table><thead id="times-head"></thead><tbody id="times-body"></tbody></table>
  </div>

  <div class="card">
    <h2>🏆 Leaderboard</h2>
    <table><thead id="board-head"></thead><tbody id="board-body"></tbody></table>
  </div>

  <footer>Generated from data/results.json · re-run <code>node get_games.js html</code> to refresh</footer>
</div>

<script>
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const players = DATA.players;
  const dates = DATA.dates.slice().sort().reverse(); // newest first
  const dateSet = new Set(dates);
  const MISSING = '—';
  let currentKey = dates[0]; // newest day

  document.getElementById('legend').innerHTML =
    players.map(p => '<span><b>' + esc(p.initial) + '</b> = ' + esc(p.name) + '</span>').join('');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function headRow() {
    return '<tr><th class="game">Game</th>' +
      players.map(p => '<th title="' + esc(p.name) + '">' + esc(p.initial) + '</th>').join('') +
      '</tr>';
  }

  function render(key) {
    currentKey = key;
    const day = DATA.days[key];
    document.getElementById('src').textContent = day.source === 'scrape' ? 'scraped' : 'seed';
    document.getElementById('dayLabel').textContent = day.label;

    document.getElementById('times-head').innerHTML = headRow();
    document.getElementById('board-head').innerHTML = headRow();

    const timesBody = day.rows.map(row => {
      const cells = row.cells.map(c => {
        const isBest = c.medal === '🥇';
        const cls = 'time' + (c.time === MISSING ? ' miss' : '') + (isBest ? ' best' : '');
        return '<td class="' + cls + '">' + esc(c.time) + '</td>';
      }).join('');
      return '<tr><td class="game">' + row.emoji + '<span class="gname">' + esc(row.name) + '</span></td>' + cells + '</tr>';
    }).join('');
    document.getElementById('times-body').innerHTML = timesBody;

    const boardBody = day.rows.map(row => {
      const cells = row.cells.map(c => {
        const isBest = c.medal === '🥇';
        return '<td class="medal' + (isBest ? ' best' : '') + '">' + (c.medal === MISSING ? '<span class="miss">—</span>' : c.medal) + '</td>';
      }).join('');
      return '<tr><td class="game">' + row.emoji + '<span class="gname">' + esc(row.name) + '</span></td>' + cells + '</tr>';
    }).join('');
    document.getElementById('board-body').innerHTML = boardBody;
  }

  // ── Day-step buttons (dates[] is newest-first) ──
  function updateNav() {
    const i = dates.indexOf(currentKey);
    document.getElementById('prev').disabled = i >= dates.length - 1; // older
    document.getElementById('next').disabled = i <= 0;                // newer
  }
  function go(key) { render(key); updateNav(); if (calVisible()) renderCal(); }

  document.getElementById('prev').addEventListener('click', () => {
    const i = dates.indexOf(currentKey);
    if (i < dates.length - 1) go(dates[i + 1]);
  });
  document.getElementById('next').addEventListener('click', () => {
    const i = dates.indexOf(currentKey);
    if (i > 0) go(dates[i - 1]);
  });

  // ── Calendar picker ──
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const pop = document.getElementById('calpop');
  let viewY, viewM; // month currently shown in the calendar

  function calVisible() { return !pop.hidden; }
  function pad2(n) { return String(n).padStart(2, '0'); }

  document.getElementById('calDow').innerHTML = DOW.map(d => '<div class="caldow">' + d + '</div>').join('');

  function renderCal() {
    document.getElementById('calTitle').textContent = MONTHS[viewM] + ' ' + viewY;
    const first = new Date(viewY, viewM, 1).getDay();      // 0=Sun
    const dim = new Date(viewY, viewM + 1, 0).getDate();    // days in month
    let cells = '';
    for (let i = 0; i < first; i++) cells += '<button class="calday empty" disabled></button>';
    for (let d = 1; d <= dim; d++) {
      const key = viewY + '-' + pad2(viewM + 1) + '-' + pad2(d);
      const has = dateSet.has(key);
      const sel = key === currentKey;
      const cls = 'calday ' + (sel ? 'sel' : has ? 'has' : 'disabled');
      cells += '<button class="' + cls + '"' + (has ? ' data-key="' + key + '"' : ' disabled') + '>' + d + '</button>';
    }
    document.getElementById('calDays').innerHTML = cells;
  }

  function openCal() {
    const [Y, M] = currentKey.split('-').map(Number);
    viewY = Y; viewM = M - 1;
    renderCal();
    pop.hidden = false;
  }
  function closeCal() { pop.hidden = true; }

  document.getElementById('dayBtn').addEventListener('click', e => {
    e.stopPropagation();
    calVisible() ? closeCal() : openCal();
  });
  document.getElementById('calPrev').addEventListener('click', e => {
    e.stopPropagation();
    if (--viewM < 0) { viewM = 11; viewY--; } renderCal();
  });
  document.getElementById('calNext').addEventListener('click', e => {
    e.stopPropagation();
    if (++viewM > 11) { viewM = 0; viewY++; } renderCal();
  });
  document.getElementById('calDays').addEventListener('click', e => {
    const btn = e.target.closest('.calday[data-key]');
    if (!btn) return;
    go(btn.dataset.key);
    closeCal();
  });
  // Close when clicking outside the popover.
  document.addEventListener('click', e => {
    if (calVisible() && !pop.contains(e.target) && e.target.id !== 'dayBtn') closeCal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCal(); });

  render(currentKey);
  updateNav();
</script>
</body>
</html>
